<text x="90" y="1097" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3a3a3a">none of the three pipelines above has a human-approval gate — once a question is submitted, or a threshold trips, or a cron fires, it runs fully autonomously end to end.</text>
<text x="90" y="1115" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3a3a3a">the only human sign-off anywhere in FinSight AI is operational: the two-environment CI/CD deploy approval in the Technical Architecture diagram, not a product feature.</text>
